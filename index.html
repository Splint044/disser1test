<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Тренажёр по наледям</title>
<style>
:root{
  --bg:#ffffff; --surface:#f7f7f7; --text:#3c3c3c; --muted:#6f6f6f; --border:#e5e5e5;
  --green:#4b9a00; --green-btn:#58cc02; --green-shadow:#46a302; --green-soft:#d7ffb8;
  --red:#d92626; --red-btn:#ff4b4b; --red-shadow:#d33131; --red-soft:#ffdfe0;
  --blue:#1cb0f6; --blue-shadow:#1899d6; --sel:#ddf4ff; --sel-border:#84d8ff;
  --gold:#ffc800; --locked:#e5e5e5;
  --c-blue:#2f6db5; --c-red:#e3342f; --c-yellow:#f2b705; --c-green:#3f9d2f; --c-orange:#ff9600; --c-purple:#8e5bd6; --c-grey:#9aa5ab;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24; --surface:#1d2b32; --text:#f1f7fb; --muted:#9db0bb; --border:#37464f;
    --green:#79d634; --green-soft:#1f3a17; --red:#ff6b6b; --red-soft:#3d1f22; --sel:#1b3a4b; --sel-border:#3d8fb8; --locked:#37464f;
    --c-blue:#5aa0ff; --c-red:#ff6b62; --c-yellow:#ffd23f; --c-green:#6fd35a; --c-grey:#6c7a82;
  }
}
:root[data-theme="dark"]{
  --bg:#131f24; --surface:#1d2b32; --text:#f1f7fb; --muted:#9db0bb; --border:#37464f;
  --green:#79d634; --green-soft:#1f3a17; --red:#ff6b6b; --red-soft:#3d1f22; --sel:#1b3a4b; --sel-border:#3d8fb8; --locked:#37464f;
  --c-blue:#5aa0ff; --c-red:#ff6b62; --c-yellow:#ffd23f; --c-green:#6fd35a; --c-grey:#6c7a82;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
body{min-height:100vh;touch-action:manipulation}
.wrap{max-width:660px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.brand{font-weight:900;font-size:22px;color:var(--green)}
.stats{display:flex;gap:12px;font-weight:800;font-size:16px;align-items:center}
.stat{display:flex;align-items:center;gap:4px}
.ic{width:20px;height:20px;display:inline-block}
.tbtn{border:2px solid var(--border);background:var(--bg);color:var(--text);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;padding:0}
.unit{border:2px solid var(--border);border-radius:16px;padding:14px 16px;margin:12px 0;display:flex;gap:14px;align-items:center;background:var(--bg)}
.unit .num{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;background:var(--green-btn);box-shadow:0 5px 0 var(--green-shadow)}
.unit.done .num{background:var(--gold);box-shadow:0 5px 0 #e0a800}
.unit .info{flex:1;min-width:0}
.unit h3{margin:0 0 4px;font-size:17px}
.unit p{margin:0;color:var(--muted);font-size:14px}
.bar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--green-btn);border-radius:6px;transition:width .3s}
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--green-btn);box-shadow:0 4px 0 var(--green-shadow);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-shadow)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-shadow)}
.btn.red{background:var(--red-btn);box-shadow:0 4px 0 var(--red-shadow)}
.btn[disabled]{background:var(--locked);color:var(--muted);box-shadow:0 4px 0 var(--border);cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.row .btn{flex:1 1 180px}
.hint{color:var(--muted);font-size:14px;line-height:1.45}
.lesson-top{display:flex;align-items:center;gap:12px;padding:8px 0 20px}
.x{border:none;background:none;font-size:30px;color:var(--muted);line-height:1;padding:0 6px}
.lesson-top .bar{flex:1;height:16px;margin:0}
.tag{display:inline-block;font-weight:800;font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.q{font-size:21px;font-weight:800;line-height:1.35;margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{text-align:left;border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;padding:14px 16px;background:var(--bg);color:var(--text);font-size:16px;line-height:1.35;display:flex;gap:12px;align-items:flex-start;min-height:54px}
.opt .k{flex:0 0 26px;height:26px;border:2px solid var(--border);border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt.sel{background:var(--sel);border-color:var(--sel-border)}
.opt.ok{background:var(--green-soft);border-color:var(--green)}
.opt.bad{background:var(--red-soft);border-color:var(--red)}
.opt[disabled]{cursor:default}
.foot{position:sticky;bottom:0;margin:24px -16px -16px;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));border-top:2px solid var(--border);background:var(--bg)}
.foot.ok{background:var(--green-soft);border-color:transparent}
.foot.bad{background:var(--red-soft);border-color:transparent}
.fb-title{font-weight:900;font-size:19px;margin:0 0 6px}
.foot.ok .fb-title{color:var(--green)} .foot.bad .fb-title{color:var(--red)}
.fb-text{margin:0 0 12px;line-height:1.45;font-size:15px}
.foot .btn{width:100%}
.fig{margin:0 0 16px;border:2px solid var(--border);border-radius:14px;padding:10px;background:var(--bg)}
.foot .fig{max-height:46vh;overflow:auto}
.fig svg{display:block;width:100%;height:auto}
.fig img{display:block;width:100%;height:auto;border-radius:8px;cursor:zoom-in}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
.center{text-align:center;padding-top:30px}
.big{font-size:40px;font-weight:900;color:var(--gold);margin:10px 0}
.cards{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.card{border:2px solid var(--border);border-radius:14px;padding:12px 16px;min-width:120px}
.card b{display:block;font-size:24px}
.card span{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase}
.link{border:none;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:8px}
/* цвета схем */
svg text{fill:var(--text);font-family:inherit}
svg .mut{fill:var(--muted)} svg .ln{stroke:var(--text);fill:none} svg .grid{stroke:var(--border);fill:none}
svg .b{fill:var(--c-blue)} svg .r{fill:var(--c-red)} svg .y{fill:var(--c-yellow)} svg .g{fill:var(--c-green)} svg .o{fill:var(--c-orange)} svg .p{fill:var(--c-purple)} svg .gr{fill:var(--c-grey)}
svg .sb{stroke:var(--c-blue)} svg .sr{stroke:var(--c-red)} svg .sg{stroke:var(--c-green)} svg .so{stroke:var(--c-orange)} svg .sgr{stroke:var(--c-grey)}
svg .box{fill:var(--surface);stroke:var(--border)}
@media (max-width:420px){.q{font-size:19px}.unit{gap:10px;padding:12px}.unit .num{flex-basis:42px;height:42px;font-size:16px}.unit .btn{padding:10px 12px;font-size:13px}.big{font-size:32px}}
</style>
</head>

const KEY = "naledi_trainer_v1";
let S = {xp: 0, best: {}, wrong: [], days: []};

S.wrong = S.wrong.filter(id => ALL.some(q => q.id === id));
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function dkey(d){ return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function streak(){ const set = new Set(S.days); let n = 0; const d = new Date(); if (!set.has(dkey(d))) d.setDate(d.getDate() - 1);
  while (set.has(dkey(d))) { n++; d.setDate(d.getDate() - 1); } return n; }
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ICON_FIRE = '<svg class="ic" viewBox="0 0 24 24"><path fill="#ff9600" d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>';

const ICON_SUN = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const isDark = () => { const r = document.documentElement.dataset.theme; return r ? r === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function toggleTheme(){ const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem(KEY + "_theme", t); } catch (e) {}
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "dark" ? "#131f24" : "#58cc02"; render(); }
let render = () => home();

// ---------- главный экран ----------
function home(){
  render = home;
  app.innerHTML = `
  <div class="top"><div class="brand">Наледи</div>
    <div class="stats"><span class="stat" title="Дней подряд">${ICON_FIRE}${streak()}</span><span class="stat" title="Очки опыта">${ICON_XP}${S.xp}</span>
    <button class="tbtn" id="theme" title="Светлая / тёмная тема" aria-label="Сменить тему">${isDark() ? ICON_SUN : ICON_MOON}</button></div></div>
  <p class="hint">Тренажёр по теории диссертации: ${UNITS.length} уроков, ${ALL.length} вопросов, к многим — схемы и рисунки из статей. Ошибки повторяются в конце урока и попадают в «Работу над ошибками». На компьютере: клавиши 1–4 — выбор, Enter — проверить.</p>
  <div class="row">
    <button class="btn blue" id="mix">Случайные 10</button>
    <button class="btn red" id="err" ${S.wrong.length ? "" : "disabled"}>Работа над ошибками (${S.wrong.length})</button>
  </div>
  ${UNITS.map((u, i) => { const b = S.best[i] || 0; return `
  <div class="unit ${b === 100 ? "done" : ""}">
    <div class="num">${i + 1}</div>
    <div class="info"><h3>${esc(u.t)}</h3><p>${esc(u.d)} · ${u.q.length} вопросов</p><div class="bar"><i style="width:${b}%"></i></div></div>
    <button class="btn" data-u="${i}">${b ? "Ещё раз" : "Начать"}</button>
  </div>`; }).join("")}
  <p class="hint" style="margin-top:20px">Полоска урока — лучший результат с первой попытки; золотой кружок — урок без ошибок. Прогресс хранится в этом браузере.
  <button class="link" id="reset">Сбросить прогресс</button></p>`;
  app.querySelectorAll("[data-u]").forEach(b => b.onclick = () => start(UNITS[+b.dataset.u].q, +b.dataset.u));
  document.getElementById("mix").onclick = () => start(shuffle(ALL).slice(0, 10), null);
  document.getElementById("err").onclick = () => start(shuffle(ALL.filter(q => S.wrong.includes(q.id))), null);
  document.getElementById("theme").onclick = toggleTheme;
  document.getElementById("reset").onclick = () => { if (confirm("Сбросить весь прогресс?")) { S = {xp: 0, best: {}, wrong: [], days: []}; save(); home(); } };
  window.scrollTo(0, 0);
}

let L = null;
function start(qs, unit){
  if (!qs.length) return;
  L = {queue: qs.map(q => ({q, first: true})), total: qs.length, done: 0, firstOk: 0, unit, xp: 0, pick: null, checked: false};
  show();
}
function show(){
  render = () => { if (L) { if (L.checked) { const p = L.pick; show(); L.pick = p; reveal(); } else show(); } };
  const it = L.queue[0], q = it.q;
  if (!it.opts) it.opts = q.tf ? q.o.map((t, i) => ({t, ok: i === q.a})) : shuffle(q.o.map((t, i) => ({t, ok: i === q.a})));
  L.opts = it.opts; L.pick = null; L.checked = false;
  const unitName = UNITS.find(u => u.q.includes(q)).t;
  app.innerHTML = `
  <div class="lesson-top"><button class="x" id="quit" aria-label="Выйти">×</button><div class="bar"><i style="width:${100 * L.done / L.total}%"></i></div></div>
  <div class="tag">${esc(unitName)}${it.first ? "" : " · повтор"}</div>
  <p class="q">${esc(q.q)}</p>
  ${figHTML(q.fq)}
  <div class="opts">${L.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
  <div class="foot" id="foot"><button class="btn" id="go" disabled>Проверить</button></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i));
  document.getElementById("go").onclick = act;
  document.getElementById("quit").onclick = () => { if (confirm("Выйти из урока? Прогресс урока не сохранится.")) { L = null; home(); } };
  bindZoom(); window.scrollTo(0, 0);
}
function choose(i){
  if (L.checked) return;
  L.pick = i;
  app.querySelectorAll(".opt").forEach((b, j) => b.classList.toggle("sel", j === i));
  document.getElementById("go").disabled = false;
}
function act(){ if (!L.checked) check(); else next(); }
function check(){
  if (L.pick === null) return;
  const it = L.queue[0], q = it.q, ok = L.opts[L.pick].ok;
  if (ok) { L.xp += it.first ? 10 : 5; if (it.first) L.firstOk++; S.wrong = S.wrong.filter(id => id !== q.id); }
  else if (!S.wrong.includes(q.id)) S.wrong.push(q.id);
  save(); reveal();
}
function reveal(){
  L.checked = true;
  const it = L.queue[0], q = it.q, ok = L.opts[L.pick].ok;
  app.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; b.classList.toggle("sel", false); if (L.opts[j].ok) b.classList.add("ok"); else if (j === L.pick) b.classList.add("bad"); });
  const right = L.opts.find(o => o.ok).t, foot = document.getElementById("foot");
  foot.className = "foot " + (ok ? "ok" : "bad");
  foot.innerHTML = `<p class="fb-title">${ok ? "Верно!" : "Неверно"}</p>
    <p class="fb-text">${ok ? "" : "<b>Правильно:</b> " + esc(right) + "<br>"}${esc(q.ex)}</p>
    ${q.fa && q.fa !== q.fq ? figHTML(q.fa) : ""}
    <button class="btn ${ok ? "" : "red"}" id="go">Продолжить</button>`;
  document.getElementById("go").onclick = act;
  bindZoom();
}
function next(){
  const it = L.queue.shift(), ok = L.opts[L.pick].ok;
  if (ok) L.done++; else L.queue.push({q: it.q, first: false});   // ошибка — вопрос вернётся в конце урока
  if (L.queue.length) show(); else finish();
}
function finish(){
  render = home;
  const pct = Math.round(100 * L.firstOk / L.total);
  S.xp += L.xp; if (!S.days.includes(dkey(new Date()))) S.days.push(dkey(new Date()));
  if (L.unit !== null) S.best[L.unit] = Math.max(S.best[L.unit] || 0, pct);
  save();
  const msg = pct === 100 ? "Без единой ошибки!" : pct >= 80 ? "Отлично!" : pct >= 50 ? "Хорошо, ошибки разобраны" : "Стоит пройти ещё раз";
  app.innerHTML = `<div class="center">
    <div class="big">${esc(msg)}</div>
    <div class="cards"><div class="card"><span>Опыт</span><b>+${L.xp}</b></div><div class="card"><span>С первого раза</span><b>${pct}%</b></div></div>
    <p class="hint">Ошибки сохранены в «Работе над ошибками» — повторите их завтра.</p>
    <div class="row"><button class="btn" id="home">На главную</button></div></div>`;
  document.getElementById("home").onclick = home;
  L = null; window.scrollTo(0, 0);
}
function bindZoom(){
  app.querySelectorAll("img[data-zoom]").forEach(im => im.onclick = () => {
    const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${im.src}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z);
  });
}
document.addEventListener("keydown", e => {
  const z = document.querySelector(".zoom"); if (z && e.key === "Escape") { z.remove(); return; }
  if (!L) return;
  if (/^[1-4]$/.test(e.key) && !L.checked && L.opts && +e.key <= L.opts.length) choose(+e.key - 1);
  else if (e.key === "Enter") { const g = document.getElementById("go"); if (g && !g.disabled) { e.preventDefault(); act(); } }
});
try { const th = localStorage.getItem(KEY + "_theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
home();
</script>
</body>
</html>
